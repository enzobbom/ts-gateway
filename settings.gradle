rootProject.name = 'gateway'

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

    repositories {
        mavenCentral()

        maven {
            url = uri("https://jitpack.io")

            content {
                includeGroup("com.github.enzobbom")
            }
        }
    }
}
