spring:
  application:
    name: ts-gateway
  cloud:
    gateway:
      mvc:
        http-client:
          type: jdk
server:
  port: 8083
management:
  endpoints:
    web:
      exposure:
        include: health
ts:
  services:
    user-service-uri: ${TS_USER_SERVICE_URI:http://localhost:8080}
    task-service-uri: ${TS_TASK_SERVICE_URI:http://localhost:8081}
  jwt:
    secret: ${TS_JWT_SECRET:local-dev-jwt-secret}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls-primary-name: User Service
    urls:
      - name: User Service
        url: /v3/api-docs/user-service
      - name: Task Service
        url: /v3/api-docs/task-service

